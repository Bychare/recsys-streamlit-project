services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${STREAMLIT_HOST_PORT:-8501}:8501"
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/processed:/app/data/processed
      - ./models:/app/models
    environment:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3); sys.exit(0)
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
